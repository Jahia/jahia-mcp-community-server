version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # The Jahia parent and org.jahia.* artifacts define the targeted Jahia/module versions.
      - dependency-name: "org.jahia.*"
      # OSGi spec artifacts change Require-Capability/Import-Package ranges (Jahia 8.2 ships DS 1.4).
      - dependency-name: "org.osgi:*"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # Shared by Jahia through module federation (@jahia/webpack-config): at runtime the
      # module uses the copies Jahia ships, and package.json only declares the required
      # version. Keep these aligned with the Jahia host; patch updates stay allowed.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-i18next"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@apollo/client"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@jahia/ui-extender"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@jahia/moonstone"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Other shared libraries and tooling whose majors need a coordinated migration.
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/tests"
    schedule:
      interval: "weekly"
    groups:
      tests-npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "cypress"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@jahia/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@apollo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql-tag"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mocha"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
