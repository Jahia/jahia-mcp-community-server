# default configuration - won't be overridden
# MCP operation access control (community.graphql.execute)
# whitelist: comma-separated GraphQL field paths, each prefixed with its operation type:
#   query:<path>     allows that query field and everything below it     (e.g. query:admin)
#   mutation:<path>  allows that mutation field and everything below it  (e.g. mutation:jcr.deleteNode)
#   An unprefixed entry (e.g. jcr) is accepted as a legacy query-only entry and logged as a WARN.
#   Malformed entries and other operation types grant nothing. A non-empty list made only of them denies everything.
#   A deeper mutation entry also runs its intermediate mutation fields (mutation:jcr.addNode.x also runs addNode).
#   Named fragment spreads are refused in every state; inline fragments are supported.
#   mutation:communityMcp and mutation:admin.jahia.configuration are always refused, whatever is listed here.
# If empty (the default), the read-only default applies: every query is allowed, except the queries under the
# privileged admin namespace (they expose OSGi configuration values, secrets included), which need an explicit
# query:admin... entry; no mutation and no subscription is allowed. Read-only means no writes, not non-sensitive:
# allowed query results are sent to the AI client.
# Once the list holds one entry, only listed operations run: a single mutation: entry refuses every unlisted query.
# Installations upgraded from 1.x may keep an older copy of this file in karaf/etc. Its comment that an empty
# list allows all operations is stale: an empty list is the read-only default described above.
# Cluster: each node reads its own copy of this configuration. Set the whitelist on every node.
# The GraphQL call runs as the administrator bound to the tool call; JCR ACLs still apply.
# Examples:
#   whitelist=query:jcr,query:currentUser,mutation:jcr.deleteNode
#   whitelist=query:admin.jahia.isAlive
whitelist=
